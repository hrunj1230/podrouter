[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-up"
version = "0.1.0"
description = "Create one RunPod Pod from a YAML config, wait until it is healthy, and always tear it down."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "runpod==1.12.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gpu-up = "gpu_up.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
