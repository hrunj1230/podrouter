<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>podrouter</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5e584f;
      --line: #e4dccf;
      --paper: #f7f3ec;
      --card: #fffdf9;
      --accent: #0f6e56;
      --warn: #8a4b08;
      --bad: #8f2d2d;
      --ok: #0f6e56;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 "Iowan Old Style", Palatino, "Apple SD Gothic Neo", serif;
      color: var(--ink);
      background: var(--paper);
    }
    header, main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 28px 0 8px; }
    h1 { font-size: 32px; margin: 0 0 4px; letter-spacing: -0.03em; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    p { color: var(--muted); margin: 0; }
    .layout { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 18px; padding: 18px 0 40px; }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 12px; }
    label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    input, select, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 7px 9px;
    }
    button { cursor: pointer; background: var(--ink); color: white; border-color: var(--ink); }
    button.quiet { background: white; color: var(--ink); }
    button:disabled { opacity: 0.45; cursor: default; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .tag { display: inline-block; border-radius: 999px; padding: 1px 7px; background: #efe8dc; }
    .tag.ok { background: #d9f3ea; color: var(--ok); }
    .tag.empty { background: #f8e4d4; color: var(--warn); }
    .banner {
      display: none;
      margin: 12px 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: #d9f3ea;
    }
    .banner.show { display: block; }
    .error { color: var(--bad); white-space: pre-wrap; }
    pre {
      white-space: pre-wrap;
      background: #221e1a;
      color: #f4efe6;
      border-radius: 10px;
      padding: 10px;
      min-height: 72px;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    form { display: grid; gap: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 860px) {
      .layout, .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>podrouter</h1>
    <p>재고 조회는 이 탭에서만 돌아갑니다. 「자리 없으면 생성 재시도」를 켜고 폴링을 시작하면, 오른쪽 설정으로 15초마다 최대 240번까지 Pod 생성을 시도합니다. 성공하거나 폴링을 멈추면 중단됩니다. 이름은 사용자가 정하고 용도를 적으면 AI가 모델과 GPU를 고른 뒤 YAML을 만들며, 띄우기는 별도 버튼입니다.</p>
    <div id="banner" class="banner"></div>
  </header>
  <main class="layout">
    <section>
      <h2>GPU 재고</h2>
      <div class="row">
        <label>간격(초)
          <input id="interval" type="number" min="15" max="300" value="15">
        </label>
        <label>보기
          <select id="filter">
            <option value="empty">1달러 미만, 자리 없음</option>
            <option value="under">1달러 미만</option>
            <option value="all">전체</option>
          </select>
        </label>
        <button id="poll" type="button">폴링 시작</button>
        <button id="refresh" class="quiet" type="button">지금 조회</button>
        <label>최대 생성 시도
          <input id="max-attempts" type="number" min="1" max="240" value="240">
        </label>
        <label><span></span>
          <input id="retry" type="checkbox"> 자리 없으면 이 설정으로 생성 재시도
        </label>
      </div>
      <p id="gpu-meta">아직 조회하지 않았습니다.</p>
      <p id="gpu-error" class="error"></p>
      <table>
        <thead>
          <tr><th>GPU</th><th>Secure</th><th>Community</th><th></th></tr>
        </thead>
        <tbody id="gpus"></tbody>
      </table>
    </section>
    <div>
      <section>
        <h2>Pod 띄우기</h2>
        <form id="launch">
          <div class="grid">
            <label>이름 <input name="name" placeholder="my-pod" required></label>
            <label>클라우드
              <select name="cloud">
                <option>SECURE</option>
                <option>COMMUNITY</option>
                <option>ALL</option>
              </select>
            </label>
            <label>GPU id <input name="gpu_id" placeholder="AI가 채웁니다" required></label>
            <label>포트 <input name="port" type="number" value="8080" required></label>
            <label>디스크 GB <input name="disk_gb" type="number" value="60" required></label>
            <label>TTL <input name="ttl" value="3h" required></label>
            <label>이미지 <input name="image" value="ghcr.io/ggml-org/llama.cpp:server-cuda13" required></label>
          </div>
          <label>용도
            <input name="wish" placeholder="한국어 대화용 공개 7B GGUF">
          </label>
          <label>인자
            <input name="args" placeholder="AI가 채웁니다">
          </label>
          <label><span></span><input name="wait" type="checkbox"> 헬스 200까지 기다린 뒤 URL 출력</label>
          <button id="plan" type="button">AI로 YAML 만들기</button>
          <button type="button" id="launch-now">이 설정으로 띄우기</button>
        </form>
        <p id="plan-reason"></p>
        <p id="launch-error" class="error"></p>
        <pre id="launch-log">아직 띄우지 않았습니다.</pre>
      </section>
      <section style="margin-top:18px">
        <h2>이 도구가 띄운 Pod</h2>
        <div class="row"><button id="pods-refresh" class="quiet" type="button">새로고침</button></div>
        <p id="pods-error" class="error"></p>
        <table>
          <thead><tr><th>이름</th><th>상태</th><th></th></tr></thead>
          <tbody id="pods"></tbody>
        </table>
      </section>
    </div>
  </main>
  <script>
    const banner = document.querySelector("#banner");
    const gpusBody = document.querySelector("#gpus");
    const podsBody = document.querySelector("#pods");
    let timer = null;
    let previousEmpty = null;
    let latest = [];
    let retryJob = null;
    let followTimer = null;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[ch]));
    }

    function money(value) {
      return typeof value === "number" ? `$${value}` : "—";
    }

    function tierCell(tier) {
      if (!tier || !tier.offered) return `<span class="tag">없음</span>`;
      const seat = tier.stock || (typeof tier.offer === "number" ? "priced" : "");
      const cls = seat ? "tag ok" : "tag empty";
      const label = seat || "자리 없음";
      return `<span class="${cls}">${label}</span> ${money(tier.offer ?? tier.price)}`;
    }

    function noSeat(tier) {
      return Boolean(tier && tier.offered && typeof tier.price === "number" && tier.price > 0 && tier.price < 1 && !tier.stock && typeof tier.offer !== "number");
    }

    function hasSeat(tier) {
      return Boolean(tier && (tier.stock || typeof tier.offer === "number"));
    }

    function visible(gpu) {
      const mode = document.querySelector("#filter").value;
      const tiers = [gpu.secure, gpu.community];
      if (mode === "all") return true;
      if (mode === "under") return tiers.some((tier) => tier && typeof tier.price === "number" && tier.price > 0 && tier.price < 1);
      return tiers.some(noSeat);
    }

    function renderGpus() {
      const rows = latest.filter(visible);
      gpusBody.innerHTML = rows.map((gpu) => `
        <tr>
          <td><strong>${esc(gpu.name)}</strong><br><span class="tag">${esc(gpu.memory_gb || "?")}GB</span></td>
          <td>${tierCell(gpu.secure)}</td>
          <td>${tierCell(gpu.community)}</td>
          <td><button class="quiet" type="button" data-id="${esc(gpu.id)}" data-secure="${esc(gpu.secure.price ?? "")}" data-community="${esc(gpu.community.price ?? "")}">선택</button></td>
        </tr>`).join("") || `<tr><td colspan="4">표시할 GPU가 없습니다.</td></tr>`;
    }

    function watchKey(tierName, gpu) {
      return `${tierName}:${gpu.id}`;
    }

    function noteArrivals() {
      const empty = new Set();
      for (const gpu of latest) {
        if (noSeat(gpu.secure)) empty.add(watchKey("secure", gpu));
        if (noSeat(gpu.community)) empty.add(watchKey("community", gpu));
      }
      if (previousEmpty && timer) {
        const found = [];
        for (const key of previousEmpty) {
          if (empty.has(key)) continue;
          const [tierName, id] = [key.slice(0, key.indexOf(":")), key.slice(key.indexOf(":") + 1)];
          const gpu = latest.find((item) => item.id === id);
          const tier = gpu && gpu[tierName];
          if (gpu && hasSeat(tier)) found.push(`${tierName} ${gpu.name} ${money(tier.offer ?? tier.price)} ${tier.stock || ""}`.trim());
        }
        if (found.length) {
          banner.textContent = `자리가 났습니다. ${found.join(" · ")}`;
          banner.classList.add("show");
        }
      }
      previousEmpty = empty;
    }

    async function loadGpus() {
      const error = document.querySelector("#gpu-error");
      error.textContent = "";
      try {
        const response = await fetch("/api/gpus");
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "조회 실패");
        latest = body.gpus || [];
        document.querySelector("#gpu-meta").textContent = `${new Date().toLocaleTimeString()} · ${latest.length}종`;
        renderGpus();
        noteArrivals();
      } catch (exc) {
        error.textContent = exc.message;
      }
    }

    function formPayload(retry) {
      const form = document.querySelector("#launch");
      const seconds = Math.min(300, Math.max(15, Number(document.querySelector("#interval").value) || 15));
      const attempts = Math.min(240, Math.max(1, Number(document.querySelector("#max-attempts").value) || 240));
      return {
        name: form.name.value,
        cloud: form.cloud.value,
        gpu_id: form.gpu_id.value,
        port: Number(form.port.value),
        disk_gb: Number(form.disk_gb.value),
        ttl: form.ttl.value,
        image: form.image.value,
        args: form.args.value,
        wait: retry ? false : form.wait.checked,
        retry_until_seat: retry,
        max_attempts: attempts,
        interval_sec: seconds,
      };
    }

    function followJob(job) {
      if (followTimer) clearInterval(followTimer);
      const log = document.querySelector("#launch-log");
      followTimer = setInterval(async () => {
        const status = await fetch(`/api/jobs/${job}`);
        const jobBody = await status.json();
        log.textContent = [jobBody.url || "", jobBody.log || ""].filter(Boolean).join("\n");
        if (jobBody.status !== "running") {
          clearInterval(followTimer);
          followTimer = null;
          retryJob = null;
          loadPods();
        }
      }, 1000);
    }

    async function setPolling(on) {
      if (timer) clearInterval(timer);
      timer = null;
      const button = document.querySelector("#poll");
      if (!on) {
        button.textContent = "폴링 시작";
        previousEmpty = null;
        if (retryJob) {
          await fetch("/api/cancel", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ job_id: retryJob }),
          });
        }
        return;
      }
      const seconds = Math.min(300, Math.max(15, Number(document.querySelector("#interval").value) || 15));
      document.querySelector("#interval").value = String(seconds);
      const retry = document.querySelector("#retry").checked;
      if (retry) {
        const payload = formPayload(true);
        const summary = `${payload.cloud} ${payload.gpu_id}, ${payload.interval_sec}초 간격, 최대 ${payload.max_attempts}회`;
        if (!confirm(`자리가 없으면 생성을 다시 시도합니다. 성공하면 과금됩니다.\n${summary}`)) return;
        const response = await fetch("/api/launch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await response.json();
        if (!response.ok) {
          document.querySelector("#launch-error").textContent = body.error || "요청 실패";
          return;
        }
        retryJob = body.job_id;
        document.querySelector("#launch-error").textContent = "";
        document.querySelector("#launch-log").textContent = "생성 재시도 중…";
        followJob(retryJob);
      }
      button.textContent = "폴링 멈춤";
      previousEmpty = null;
      loadGpus();
      timer = setInterval(loadGpus, seconds * 1000);
    }

    async function loadPods() {
      const error = document.querySelector("#pods-error");
      error.textContent = "";
      try {
        const response = await fetch("/api/pods");
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "목록 실패");
        const pods = body.pods || [];
        podsBody.innerHTML = pods.map((pod) => `
          <tr>
            <td>${esc(pod.name)}<br><span class="tag">${esc(pod.gpu || pod.pod_id)}</span></td>
            <td>${esc(pod.state)}<br>${money(pod.hourly_price)}/h · 남은 TTL ${esc(pod.remaining_ttl_sec ?? "—")}초</td>
            <td><button class="quiet" type="button" data-down="${esc(pod.name)}">끄기</button></td>
          </tr>`).join("") || `<tr><td colspan="3">없습니다.</td></tr>`;
      } catch (exc) {
        error.textContent = exc.message;
      }
    }

    document.querySelector("#poll").addEventListener("click", () => setPolling(!timer));
    document.querySelector("#refresh").addEventListener("click", loadGpus);
    document.querySelector("#filter").addEventListener("change", renderGpus);
    document.querySelector("#pods-refresh").addEventListener("click", loadPods);
    gpusBody.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;
      const form = document.querySelector("#launch");
      form.gpu_id.value = button.dataset.id;
    });
    podsBody.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-down]");
      if (!button) return;
      if (!confirm(`${button.dataset.down} Pod를 끌까요?`)) return;
      const response = await fetch("/api/down", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: button.dataset.down }),
      });
      const body = await response.json();
      if (!response.ok) document.querySelector("#pods-error").textContent = body.error || "종료 실패";
      loadPods();
    });
    document.querySelector("#plan").addEventListener("click", async () => {
      const form = document.querySelector("#launch");
      const error = document.querySelector("#launch-error");
      const reasonEl = document.querySelector("#plan-reason");
      const log = document.querySelector("#launch-log");
      error.textContent = "";
      reasonEl.textContent = "";
      try {
        const payload = {
          name: form.name.value,
          wish: form.wish.value,
        };
        const response = await fetch("/api/plan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await response.json();
        if (!response.ok) {
          error.textContent = body.error || "YAML 생성 실패";
          return;
        }
        if (body.gpu_id) form.gpu_id.value = body.gpu_id;
        if (body.cloud) form.cloud.value = body.cloud;
        if (body.document) {
          if (body.document.name) form.name.value = body.document.name;
          if (body.document.args) form.args.value = body.document.args;
          if (body.document.image) form.image.value = body.document.image;
          if (body.document.port != null) form.port.value = body.document.port;
          if (body.document.storage && body.document.storage.container_disk_gb != null) {
            form.disk_gb.value = body.document.storage.container_disk_gb;
          }
          if (body.document.lifecycle && body.document.lifecycle.ttl) {
            form.ttl.value = body.document.lifecycle.ttl;
          }
        }
        if (body.reason) reasonEl.textContent = body.reason;
        if (body.yaml) log.textContent = body.yaml;
      } catch (exc) {
        error.textContent = exc.message;
      }
    });
    document.querySelector("#launch").addEventListener("submit", (event) => {
      event.preventDefault();
    });
    document.querySelector('input[name="wish"]').addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        document.querySelector("#plan").click();
      }
    });
    document.querySelector("#launch-now").addEventListener("click", async () => {
      const error = document.querySelector("#launch-error");
      const log = document.querySelector("#launch-log");
      error.textContent = "";
      const payload = formPayload(false);
      const summary = `${payload.cloud} ${payload.gpu_id} TTL ${payload.ttl}`;
      if (!confirm(`Pod를 띄울까요?\n${summary}`)) return;
      log.textContent = "생성 요청 중…";
      const response = await fetch("/api/launch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const body = await response.json();
      if (!response.ok) {
        error.textContent = body.error || "요청 실패";
        log.textContent = "띄우지 못했습니다.";
        return;
      }
      followJob(body.job_id);
    });
    loadGpus();
    loadPods();
  </script>
</body>
</html>
